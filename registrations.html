
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrations | IGNITE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #09090d;
            color: #f5f0e9;
            font-family: 'Outfit', 'Inter', Arial, sans-serif;
            min-height: 100vh;
            background-image:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(139, 49, 20, 0.19) 0%,
                    transparent 55%
                ),
                radial-gradient(
                    ellipse at 100% 100%,
                    rgba(100, 22, 20, 0.12) 0%,
                    transparent 50%
                );
        }

        .regs-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 100px 30px 80px;
            font-family: 'Outfit', 'Inter', Arial, sans-serif;
        }

        .regs-container h1 {
            margin: 0 0 18px;
            text-align: center;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: clamp(34px, 6vw, 54px);
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(
                110deg,
                #fff0d0 5%,
                #ffbd65 35%,
                #f47732 65%,
                #c83b27 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .regs-container > p {
            margin: 0 auto 55px;
            max-width: 600px;
            text-align: center;
            color: #aaa5a0;
            font-size: 16px;
            line-height: 1.8;
            font-weight: 400;
        }

        .regs-section {
            margin-bottom: 30px;
            padding: 32px;
            border: 1px solid rgba(236, 126, 62, 0.19);
            border-radius: 14px;
            background: linear-gradient(
                145deg,
                rgba(30, 27, 28, 0.96),
                rgba(17, 16, 19, 0.98)
            );
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);
            transition: border-color 0.3s ease,
                        transform 0.3s ease;
        }

        .regs-section:hover {
            border-color: rgba(242, 133, 67, 0.42);
            transform: translateY(-3px);
        }

        .regs-section h2 {
            margin: 0 0 25px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
            color: #f6e5d2;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .reg-link {
            display: block;
            margin: 14px 0;
            padding: 17px 22px;
            background: linear-gradient(
                110deg,
                #e87532 0%,
                #d34c28 55%,
                #a92b29 100%
            );
            color: #ffffff;
            text-decoration: none;
            border: 1px solid rgba(255, 188, 120, 0.25);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: 0.5px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(188, 58, 32, 0.15);
            transition:
                background 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }

        .reg-link:hover {
            background: linear-gradient(
                110deg,
                #ff9948 0%,
                #ed6134 55%,
                #c93b30 100%
            );
            box-shadow: 0 7px 25px rgba(225, 85, 43, 0.3);
            transform: translateY(-2px);
        }

        .reg-link:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            .regs-container {
                padding: 65px 18px 50px;
            }

            .regs-container > p {
                font-size: 14px;
                margin-bottom: 38px;
            }

            .regs-section {
                padding: 23px 18px;
                margin-bottom: 22px;
            }

            .regs-section h2 {
                font-size: 19px;
            }

            .reg-link {
                padding: 15px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Insert your site Navigation Bar here -->

    <main class="regs-container">

        <h1>IGNITE Registrations</h1>

        <p>Please select the appropriate form below to register for the Cultural and Sports events.</p>

        <div class="regs-section">

            <h2>Cultural Events</h2>

            <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=aCQie8M0_kqLKG-GTvOs8eliUCe96EBLjMm9ltWc_D9UNVJFV05ZR1c0SDZNQ0NFVVhJQ05SMjFJUS4u"
               target="_blank"
               rel="noopener noreferrer"
               class="reg-link">
                Internal Cultural Registration Form
            </a>

            <a href="https://docs.google.com/forms/d/e/1FAIpQLSf7Qx9YZfmhNyU7XzXcaIyCXeOdyOzJ3tWl7-anwxPLo6BP4g/viewform?usp=header"
               target="_blank"
               rel="noopener noreferrer"
               class="reg-link">
                External Cultural Registration Form
            </a>

        </div>

        <div class="regs-section">

            <h2>Sports Events</h2>

            <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=aCQie8M0_kqLKG-GTvOs8bSKK20ya4dFvGMd6K-dTP1UNlBZMkg2V0cyRjM1OUhLMVdZQ1lCMU8wVS4u"
               target="_blank"
               rel="noopener noreferrer"
               class="reg-link">
                Internal Sports Registration Form
            </a>

            <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=aCQie8M0_kqLKG-GTvOs8QXE6bmoZHBAlFDUkLZU5I9UQ1ZLMU82NkxLV0JTSFlaQzU2VjZJUEkyVS4u"
               target="_blank"
               rel="noopener noreferrer"
               class="reg-link">
                External Sports Registration Form
            </a>

        </div>

    </main>

    <!-- Insert your site Footer here -->

</body>
</html>
