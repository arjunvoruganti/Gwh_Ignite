
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrations | IGNITE</title>

    <!-- Exact fonts used by IGNITE main website -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #070709;
            --surface-color: rgba(18, 18, 24, 0.65);
            --surface-card: rgba(22, 22, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 75, 43, 0.3);

            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --text-subtle: #6b7280;

            --accent-gold: #f59e0b;
            --accent-orange: #ff4b2b;
            --accent-fire: #ff416c;
            --accent-crimson: #e11d48;

            --gradient-glow: linear-gradient(
                135deg,
                #ff416c 0%,
                #ff4b2b 45%,
                #f59e0b 100%
            );

            --gradient-fire: linear-gradient(
                135deg,
                #ff416c 0%,
                #ff4b2b 45%,
                #f59e0b 100%
            );

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;

            --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Main registration page layout */

        .regs-container {
            max-width: 1300px;
            min-height: 85vh;
            margin: 0 auto;
            padding: 150px 24px 100px;
        }

        /* Main heading - matching IGNITE section titles */

        .regs-container h1 {
            font-size: clamp(2.4rem, 5vw, 3.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 20px;
            text-align: center;

            background: var(--gradient-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .regs-container > p {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 50px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        /* Registration sections - matching .glass-card */

        .regs-section {
            max-width: 900px;
            margin: 0 auto 28px;
            padding: 40px;

            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .regs-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;

            background: var(--gradient-glow);

            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
        }

        .regs-section:hover {
            transform: translateY(-8px);
            background: rgba(30, 30, 30, 0.8);
            border-color: rgba(255, 75, 43, 0.3);
        }

        .regs-section:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* Section headings */

        .regs-section h2 {
            font-size: 1.55rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--text-main);
            letter-spacing: 0.3px;
        }

        /* Registration buttons - matching .btn-glow */

        .reg-link {
            position: relative;
            display: block;
            padding: 16px 30px;
            margin: 14px 0;

            color: var(--text-main);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-size: 0.88rem;
            text-decoration: none;
            text-align: center;

            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 75, 43, 0.45);
            border-radius: 30px;

            transition: var(--transition);
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .reg-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: var(--gradient-glow);
            z-index: -1;

            transition: opacity 0.4s ease;
            opacity: 0;
        }

        .reg-link:hover {
            border-color: transparent;
            transform: scale(1.05);
        }

        .reg-link:hover::before {
            opacity: 1;
        }

        /* Responsive styling */

        @media (max-width: 768px) {

            .regs-container {
                padding: 120px 20px 70px;
            }

            .regs-container h1 {
                font-size: 2.4rem;
            }

            .regs-container > p {
                font-size: 1rem;
                margin-bottom: 35px;
            }

            .regs-section {
                padding: 28px 22px;
                margin-bottom: 22px;
            }

            .regs-section h2 {
                font-size: 1.3rem;
            }

            .reg-link {
                padding: 14px 18px;
                font-size: 0.78rem;
                letter-spacing: 0.7px;
            }
        }

    </style>
</head>

<body>

               target="_blank"

               class="reg-link">

            </a>

            <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=aCQie8M0_kqLKG-GTvOs8QXE6bmoZHBAlFDUkLZU5I9UQ1ZLMU82NkxLV0JTSFlaQzU2VjZJUEkyVS4u"

    </main>

    <!-- Insert your site Footer here -->

</body>
</html>
